version: '3.9'

networks:
  erp-network:
    driver: bridge

services:
  backend:
    image: node:20-alpine
    container_name: cloud-erp-backend
    working_dir: /app
    restart: unless-stopped
    networks:
      - erp-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      APP_PORT: 4100
      DB_HOST: cloud-erp-db
      DB_PORT: 5432
      DB_NAME: cloud_erp
      DB_USER: erp_user
      DB_PASSWORD: erp_secure_password
      JWT_SECRET: cloud-erp-super-secret-jwt-key-2026-change-in-production
      JWT_EXPIRES_IN: 8h
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      LOG_LEVEL: info
    ports:
      - "4100:4100"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm install && npx ts-node-dev --respawn --transpile-only src/index.ts"

  frontend:
    image: node:20-alpine
    container_name: cloud-erp-frontend
    working_dir: /app
    restart: unless-stopped
    networks:
      - erp-network
    environment:
      VITE_API_URL: http://localhost:4100/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
