version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloud-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloud_erp
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d cloud_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloud-erp-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud-erp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloud_erp
      DB_USER: erp_user
      DB_PASSWORD: ${DB_PASSWORD:-erp_secure_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-cloud-erp-super-secret-jwt-key-change-in-production-2026}
      JWT_EXPIRES_IN: 8h
      # Same-origin requests go through the frontend nginx /api proxy, but list the
      # public domain too so direct API calls / tools are accepted.
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    # No host port mapping: the backend is reached only internally by the frontend
    # nginx (/api → http://backend:4000) over the Docker network. This avoids host
    # port 4000 conflicts with other apps on the server.
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloud-erp-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  # One-shot migration + seed runner. Uses ts-node against the TypeScript
  # migrations (same as dev) so we don't need pre-compiled JS migrations.
  # Run with:  docker compose --profile migrate run --rm migrate
  migrate:
    image: node:20-alpine
    container_name: cloud-erp-migrate
    working_dir: /app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloud_erp
      DB_USER: erp_user
      DB_PASSWORD: ${DB_PASSWORD:-erp_secure_password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - migrate_node_modules:/app/node_modules
    command: >
      sh -c "npm install &&
             npx knex --knexfile src/config/knexfile.ts migrate:latest &&
             npx knex --knexfile src/config/knexfile.ts seed:run &&
             echo '✅ Migration and seed complete'"
    profiles:
      - migrate

volumes:
  migrate_node_modules:
  postgres_data:
  uploads:
  logs:
